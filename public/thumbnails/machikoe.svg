<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="240" fill="#f0fdf8"/>
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a4ecd7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffeedd" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect width="400" height="36" fill="#0ea57e" opacity="0.92"/>
  <text x="16" y="23" font-family="sans-serif" font-size="13" font-weight="700" fill="white">マチコエ</text>
  <text x="85" y="23" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.75)">街の声を、議会へ。</text>
  <rect x="340" y="9" width="48" height="18" rx="9" fill="rgba(255,255,255,0.2)"/>
  <text x="364" y="21" text-anchor="middle" font-family="sans-serif" font-size="9" fill="white">富士河口湖</text>

  <!-- Card 1 -->
  <rect x="16" y="50" width="368" height="56" rx="10" fill="white" stroke="#d1fae5" stroke-width="1"/>
  <rect x="16" y="50" width="3" height="56" rx="2" fill="#0ea57e"/>
  <rect x="26" y="60" width="44" height="14" rx="7" fill="#d1fae5"/>
  <text x="48" y="71" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#0ea57e" font-weight="600">観光</text>
  <rect x="76" y="60" width="66" height="14" rx="7" fill="#fef3c7"/>
  <text x="109" y="71" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#d97706" font-weight="600">インバウンド</text>
  <text x="328" y="71" font-family="sans-serif" font-size="9" fill="#9ca3af">4月1日</text>
  <text x="26" y="91" font-family="sans-serif" font-size="11" font-weight="700" fill="#1f2937">観光振興に関する審議</text>

  <!-- Card 2 -->
  <rect x="16" y="116" width="368" height="56" rx="10" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="16" y="116" width="3" height="56" rx="2" fill="#3b82f6"/>
  <rect x="26" y="126" width="44" height="14" rx="7" fill="#dbeafe"/>
  <text x="48" y="137" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#2563eb" font-weight="600">子育て</text>
  <text x="328" y="137" font-family="sans-serif" font-size="9" fill="#9ca3af">3月1日</text>
  <text x="26" y="157" font-family="sans-serif" font-size="11" font-weight="700" fill="#1f2937">子育て支援施策に関する審議</text>

  <!-- Bottom stats bar -->
  <rect x="16" y="184" width="368" height="40" rx="10" fill="white" stroke="#d1fae5" stroke-width="1"/>
  <text x="36" y="208" font-family="sans-serif" font-size="10" fill="#6b7280">今期の議題</text>
  <text x="90" y="208" font-family="sans-serif" font-size="13" font-weight="700" fill="#1f2937">24</text>
  <text x="130" y="208" font-family="sans-serif" font-size="10" fill="#d1d5db">·</text>
  <text x="146" y="208" font-family="sans-serif" font-size="10" fill="#6b7280">みんなの声</text>
  <text x="204" y="208" font-family="sans-serif" font-size="13" font-weight="700" fill="#0ea57e">89</text>
  <rect x="288" y="193" width="84" height="22" rx="11" fill="#0ea57e"/>
  <text x="330" y="208" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="white">意見を投稿する</text>
</svg>
